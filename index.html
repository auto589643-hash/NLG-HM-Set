</style></head><body><div class="app"><div class="top noexport"><div class="bar"><div class="bar1"><div class="brand"><small>NLG • HM SET</small><b>Schedule Builder</b></div><div class="nav"><button id="prev">‹</button><input id="month" type="month"><button id="next">›</button></div></div><div class="actions"><button class="btn primary" id="addTop">＋ เพิ่มตาราง</button><button class="btn" id="copy">คัดลอกเดือนก่อน</button><button class="btn export">สร้างภาพ</button><button class="btn danger" id="reset">ล้างเดือน</button></div></div></div><main id="capture"><div class="head"><div><h1 id="mt"></h1><p>แตะวันที่เพื่อเพิ่มรายการ • ระบบจัด Week โดยให้วันพฤหัสเป็น Anchor</p></div><div class="count" id="count"></div></div><div class="weeks" id="weeks"></div></main></div><button class="fab noexport" id="fab">＋ เพิ่มตาราง</button>

(()=>{const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},clone=x=>JSON.parse(JSON.stringify(x));const WC=[['#6e61e8','#eeecff'],['#0e86d4','#e8f5ff'],['#0c9b70','#e8f8f1'],['#e98128','#fff1e5'],['#d54888','#fdebf4'],['#65707e','#eef1f4']],C=['#5d63e6','#0e86d4','#0c9b70','#e98128','#d54888','#e5484d','#65707e','#f3c617'],TC={HM:C[0],Speaker:C[1],Product:C[2],Bring:C[3],Set:C[4],'Special Event':C[5],Other:C[6]},D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];let state,ym='',edit=null,col=C[0];const month=$('#month'),weeks=$('#weeks'),modal=$('#modal');function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function th(d){let x=new Date(d);x.setDate(x.getDate()+(4-x.getDay()+7)%7);return x}function build(y,m){let e=new Date(y,m+1,0),a=th(new Date(y,m,1)),o=[];for(;;){let s=new Date(a);s.setDate(a.getDate()-6);o.push({s,a:new Date(a)});if(a>=e)break;a.setDate(a.getDate()+7)}return o}function widx(date,ws){let a=iso(th(parse(date)));return ws.findIndex(w=>iso(w.a)===a)}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1500)}function load(y,m){ym=`${y}-${pad(m+1)}`;month.value=ym;state=JSON.parse(localStorage.getItem('nlg-hm-v3:'+ym)||`{"year":${y},"month":${m},"items":[]}`);render()}function save(){localStorage.setItem('nlg-hm-v3:'+ym,JSON.stringify(state));render()}function render(){let ws=build(state.year,state.month);$('#mt').textContent=new Date(state.year,state.month,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});$('#count').textContent=`${state.items.length} รายการ`;weeks.innerHTML=ws.map((w,i)=>weekHTML(w,i,ws)).join('')}function weekHTML(w,i,ws){let[main,soft]=WC[i%WC.length],it=state.items.filter(x=>widx(x.date,ws)===i).sort((a,b) return;let a=th(parse(v)),ws=build(state.year,state.month),i=ws.findIndex(w=>iso(w.a)===iso(a));$('#preview').innerHTML=i<0?'<b>อยู่นอกเดือนนี้</b>':`<i style="background:${WC[i%WC.length][0]}"></i><div><b>Week ${i+1}</b><br>${ws[i].s.toLocaleDateString('th-TH',{day:'numeric',month:'short'})} — ${ws[i].a.toLocaleDateString('th-TH',{day:'numeric',month:'short'})} • Anchor พฤหัส ${a.getDate()}</div>`}function open(d,id=null){edit=id;let x=id?state.items.find(x=>x.id===id):null;$('#ft').textContent=id?'แก้ไขตาราง':'เพิ่มตาราง';$('#date').value=x?.date||d||`${ym}-01`;$('#type').value=x?.type||'HM';$('#title').value=x?.title||'';$('#detail').value=x?.detail||'';col=x?.color||TC[$('#type').value];colorUI();prev();modal.classList.add('open')}function close(){modal.classList.remove('open');edit=null}$('#date').onchange=prev;$('#type').onchange=()=>{col=TC[$('#type').value]||C[0];colorUI()};$('#colors').onclick=e=>{let b=e.target.closest('[data-color]');if(b){col=b.dataset.color;colorUI()}};$('#save').onclick=()=>{let d=$('#date').value,t=$('#title').value.trim();if(!d)return toast('เลือกวันที่ก่อน');if(!t)return toast('ใส่หัวข้อก่อน');let q=parse(d);if(q.getFullYear()!==state.year||q.getMonth()!==state.month)return toast('วันที่ต้องอยู่ในเดือนนี้');let data={date:d,type:$('#type').value,title:t,detail:$('#detail').value.trim(),color:col},was=!!edit;if(edit){let i=state.items.findIndex(x=>x.id===edit);state.items[i]={...state.items[i],...data}}else state.items.push({id:'i'+Date.now()+Math.random().toString(16).slice(2),...data});save();close();toast(was?'แก้ไขแล้ว':'เพิ่มลง Week แล้ว')};$('#cancel').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};weeks.onclick=e=>{let d=e.target.closest('[data-date]');if(d)return open(d.dataset.date);let ed=e.target.closest('[data-edit]');if(ed)return open(null,ed.dataset.edit);let del=e.target.closest('[data-del]');if(del){let x=state.items.find(x=>x.id===del.dataset.del);if(x&&confirm(`ลบ “${x.title}” ?`)){state.items=state.items.filter(x=>x.id!==del.dataset.del);save()}}};$('#fab').onclick=$('#addTop').onclick=()=>open(`${ym}-01`);function shift(n){let d=new Date(state.year,state.month+n,1);load(d.getFullYear(),d.getMonth())}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);month.onchange=()=>{if(month.value){let[y,m]=month.value.split('-').map(Number);load(y,m-1)}};$('#copy').onclick=()=>{let d=new Date(state.year,state.month-1,1),k='nlg-hm-v3:'+`${d.getFullYear()}-${pad(d.getMonth()+1)}`,raw=localStorage.getItem(k);if(!raw)return toast('ยังไม่มีข้อมูลเดือนก่อน');let p=JSON.parse(raw),md=new Date(state.year,state.month+1,0).getDate();state.items=p.items.map(x=>{let od=parse(x.date),day=Math.min(od.getDate(),md);return{...clone(x),id:'i'+Date.now()+Math.random().toString(16).slice(2),date:`${ym}-${pad(day)}`}});save();toast('คัดลอกแล้ว')};$('#reset').onclick=()=>{if(confirm('ล้างรายการเดือนนี้ทั้งหมด?')){state.items=[];save()}};async function exp(){if(typeof html2canvas!=='function')return toast('ตัวสร้างภาพยังโหลดไม่เสร็จ');toast('กำลังสร้างภาพ...');document.body.classList.add('exporting');await new Promise(r=>setTimeout(r,80));try{let c=await html2canvas($('#capture'),{backgroundColor:'#f5f7fb',scale:2,useCORS:true,logging:false}),blob=await new Promise(r=>c.toBlob(r,'image/png',1)),name=`NLG-HM-${ym}.png`,file=new File([blob],name,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}finally{document.body.classList.remove('exporting')}}$$('.export').forEach(b=>b.onclick=exp);let now=new Date();load(now.getFullYear(),now.getMonth())})();
