<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>NLG HM Set</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6b6b70;--line:#161616;--tue:#f4bfd4;--tue2:#fbe5ee;--thu:#f04a3f;--thu2:#f6b2ab;--blue:#2448f2;--red:#ef3b31;--yellow:#fff200;--shadow:0 16px 45px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;color:var(--text)}button,input,select{font:inherit}button{touch-action:manipulation}.shell{max-width:1700px;margin:auto;padding:14px 14px 80px}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ddd;border-radius:18px;padding:10px;box-shadow:0 8px 25px rgba(0,0,0,.05);margin-bottom:14px}.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{min-height:44px;border:1px solid #d2d2d7;background:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.danger{color:#b42318}.btn.icon{min-width:44px;font-size:24px;padding:5px}.month{height:44px;border:1px solid #d2d2d7;border-radius:12px;padding:0 12px;background:#fff;font-weight:700}.status{font-size:12px;color:#287a46;background:#edf8f0;padding:7px 10px;border-radius:99px}.board{background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden}.title{padding:13px;text-align:center;border-bottom:2px solid var(--line);font-size:clamp(25px,3vw,42px);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:800}.weekday{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line);font-weight:900;text-align:center}.weekday>div{padding:8px}.weekday .tue{background:var(--tue)}.weekday .thu{background:var(--thu)}.weekday>div+div{border-left:2px solid var(--line)}.special{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px;border-bottom:2px solid var(--line);font-weight:800}.special button{border:0;background:rgba(255,255,255,.7);border-radius:9px;padding:7px 10px}.week{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}.week:last-child{border-bottom:0}.day{min-width:0}.day+.day{border-left:2px solid var(--line)}.dayhead{display:grid;grid-template-columns:105px 1fr;border-bottom:2px solid var(--line);min-height:46px}.datebox{display:flex;align-items:center;justify-content:center;font-weight:900;border-right:2px solid var(--line)}.day.tuesday .datebox{background:var(--tue2)}.day.thursday .datebox{background:var(--thu2)}.weeklabel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;font-weight:800;background:#fafafa}.tiny{border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700}.section{border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.sectionbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:#f7f7f8;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;text-transform:uppercase}.rows{display:block}.row{display:grid;grid-template-columns:110px 1fr 42px;min-height:52px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.cell{min-width:0;border:0;border-right:1px solid var(--line);padding:10px;background:#fff}.cell.label{font-weight:800}.cell.value{color:var(--blue);text-align:center;font-weight:700}.cell:focus{outline:3px solid rgba(36,72,242,.18);outline-offset:-3px}.del{border:0;background:#fff;color:#aaa;font-size:18px}.del:active{background:#fee}.setrow{display:grid;grid-template-columns:1fr 1fr 42px;min-height:52px;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}.setrow .value.red{color:var(--red)}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.float{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;border:0;border-radius:16px;padding:13px 17px;background:#111;color:#fff;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.2)}.modalback{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.36);display:none;align-items:flex-end;justify-content:center}.modalback.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));box-shadow:0 -15px 50px rgba(0,0,0,.18)}.modal h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;height:46px;border:1px solid #ccc;border-radius:12px;padding:0 11px;background:#fff}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.toast{position:fixed;left:50%;bottom:25px;z-index:200;transform:translate(-50%,25px);opacity:0;background:#111;color:#fff;padding:10px 14px;border-radius:99px;font-size:13px;pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:820px){.shell{padding:8px 8px 90px}.toolbar{position:relative;border-radius:14px}.toolbar .actions .primary{display:none}.weekday{display:none}.week{display:block}.day+.day{border-left:0;border-top:5px solid var(--bg)}.dayhead{grid-template-columns:95px 1fr}.row{grid-template-columns:95px 1fr 38px}.setrow{grid-template-columns:1fr 1fr 38px}.float{display:block}.title{font-size:28px}.board{border-width:1.5px}.special{min-height:54px}.btn,.month{min-height:46px}.group{width:100%}.toolbar .group:first-child{justify-content:space-between}.toolbar .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.toolbar .actions .btn{width:100%}}
@media print{.toolbar,.float,.sectionbar .tiny,.weeklabel .tiny,.del{display:none!important}.shell{max-width:none;padding:0}.board{box-shadow:none}.weekday{display:grid}.week{display:grid;grid-template-columns:1fr 1fr}.day+.day{border-left:2px solid #111;border-top:0}}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <div class="group">
      <button class="btn icon" id="prev">‹</button>
      <input class="month" id="month" type="month">
      <button class="btn icon" id="next">›</button>
      <span class="status" id="status">บันทึกอัตโนมัติ</span>
    </div>
    <div class="group actions">
      <button class="btn" id="addEvent">+ Special Event</button>
      <button class="btn" id="copyPrev">Copy เดือนก่อน</button>
      <button class="btn danger" id="reset">ล้างเดือนนี้</button>
      <button class="btn primary export">สร้างภาพ PNG</button>
    </div>
  </div>
  <main class="board" id="board">
    <div class="title" id="title"></div>
    <div class="weekday"><div class="tue">TUESDAY</div><div class="thu">THURSDAY</div></div>
    <div id="events"></div><div id="weeks"></div>
  </main>
</div>
<button class="float export">สร้างภาพ PNG</button>
<div class="modalback" id="modal"><div class="modal"><h2>เพิ่ม Special Event</h2>
  <div class="field"><label>วันที่</label><input id="eventDate" type="date"></div>
  <div class="field"><label>ชื่อ Event</label><input id="eventTitle" placeholder="เช่น Awaken Club"></div>
  <div class="field"><label>สี</label><select id="eventColor"><option value="#fff200">Yellow</option><option value="#dff7df">Green</option><option value="#dfe8ff">Blue</option><option value="#ffe0dc">Coral</option><option value="#f3e3ff">Purple</option></select></div>
  <div class="modalactions"><button class="btn" id="cancelEvent">ยกเลิก</button><button class="btn primary" id="saveEvent">เพิ่ม Event</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const monthEl=$('#month'), titleEl=$('#title'), weeksEl=$('#weeks'), eventsEl=$('#events'), statusEl=$('#status');
const keyPrefix='nlg-hm-set-v1:'; let state=null, ym=''; let saveTimer;
const pad=n=>String(n).padStart(2,'0'); const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
const shortDate=d=>`${d.getDate()} ${d.toLocaleDateString('en-US',{month:'short'})}`;
const newDay=()=>({hm:[{label:'',value:''}],set:[{label:'1. Battery Checker ไมค์+ลำโพง',value:'ข้าวโอ๊ต สุดหล่อ / สีน้ำ'},{label:'2. Speaker Sound Checker',value:'ข้าว'},{label:'3. TV Screen+Sound Checker',value:'All'}]});
function thursdays(y,m){const out=[];let d=new Date(y,m,1);while(d.getDay()!=4)d.setDate(d.getDate()+1);while(d.getMonth()===m){out.push(new Date(d));d.setDate(d.getDate()+7)}return out}
function blankState(y,m){return{year:y,month:m,events:[],weeks:thursdays(y,m).map((thu,i)=>{let tue=new Date(thu);tue.setDate(thu.getDate()-2);return{id:'w'+i,tue:iso(tue),thu:iso(thu),tuesday:newDay(),thursday:newDay()}})}}
function load(y,m){ym=`${y}-${pad(m+1)}`;monthEl.value=ym;const raw=localStorage.getItem(keyPrefix+ym);state=raw?JSON.parse(raw):blankState(y,m);render()}
function save(){localStorage.setItem(keyPrefix+ym,JSON.stringify(state));statusEl.textContent='บันทึกแล้ว';clearTimeout(saveTimer);saveTimer=setTimeout(()=>statusEl.textContent='บันทึกอัตโนมัติ',1000)}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rowHTML(wi,side,kind,row,ri){if(kind==='hm')return `<div class="row"><input class="cell label" data-w="${wi}" data-side="${side}" data-kind="hm" data-r="${ri}" data-f="label" value="${esc(row.label)}" placeholder="Speaker / Product"><input class="cell value" data-w="${wi}" data-side="${side}" data-kind="hm" data-r="${ri}" data-f="value" value="${esc(row.value)}" placeholder="ชื่อ / Product"><button class="del" data-del="1" data-w="${wi}" data-side="${side}" data-kind="hm" data-r="${ri}">×</button></div>`;
return `<div class="setrow"><input class="cell label" data-w="${wi}" data-side="${side}" data-kind="set" data-r="${ri}" data-f="label" value="${esc(row.label)}"><input class="cell value ${/ข้าว/.test(row.value)?'red':''}" data-w="${wi}" data-side="${side}" data-kind="set" data-r="${ri}" data-f="value" value="${esc(row.value)}"><button class="del" data-del="1" data-w="${wi}" data-side="${side}" data-kind="set" data-r="${ri}">×</button></div>`}
function dayHTML(w,wi,side){const obj=w[side], date=new Date(side==='tuesday'?w.tue:w.thu);const cls=side==='tuesday'?'tuesday':'thursday';return `<section class="day ${cls}"><div class="dayhead"><div class="datebox">${shortDate(date)}</div><div class="weeklabel"><span>WEEK ${wi+1}</span><button class="tiny" data-copyweek="${wi}" data-side="${side}">Copy ก่อนหน้า</button></div></div><div class="section"><div class="sectionbar"><span>HM / Product</span><button class="tiny" data-add="hm" data-w="${wi}" data-side="${side}">+ Add</button></div><div class="rows">${obj.hm.length?obj.hm.map((r,i)=>rowHTML(wi,side,'hm',r,i)).join(''):'<div class="empty">ยังไม่มีรายการ</div>'}</div></div><div class="section"><div class="sectionbar"><span>Set</span><button class="tiny" data-add="set" data-w="${wi}" data-side="${side}">+ Add</button></div><div class="rows">${obj.set.length?obj.set.map((r,i)=>rowHTML(wi,side,'set',r,i)).join(''):'<div class="empty">ยังไม่มีรายการ</div>'}</div></div></section>`}
function render(){titleEl.textContent=monthName(state.year,state.month);eventsEl.innerHTML=state.events.sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>`<div class="special" style="background:${e.color}"><span>${new Date(e.date).toLocaleDateString('en-GB',{day:'numeric',month:'long'})} ${esc(e.title)}</span><button data-delevent="${i}">ลบ</button></div>`).join('');weeksEl.innerHTML=state.weeks.map((w,i)=>`<div class="week">${dayHTML(w,i,'tuesday')}${dayHTML(w,i,'thursday')}</div>`).join('');}
weeksEl.addEventListener('input',e=>{const t=e.target;if(!t.dataset.w)return;const w=state.weeks[+t.dataset.w], obj=w[t.dataset.side], row=obj[t.dataset.kind][+t.dataset.r];row[t.dataset.f]=t.value;save()});
weeksEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add){const arr=state.weeks[+b.dataset.w][b.dataset.side][b.dataset.add];arr.push(b.dataset.add==='hm'?{label:'',value:''}:{label:'',value:''});save();render()}else if(b.dataset.del){const arr=state.weeks[+b.dataset.w][b.dataset.side][b.dataset.kind];arr.splice(+b.dataset.r,1);save();render()}else if(b.dataset.copyweek!=null){const i=+b.dataset.copyweek;if(i===0)return toast('นี่คือ Week แรก');const side=b.dataset.side;state.weeks[i][side]=JSON.parse(JSON.stringify(state.weeks[i-1][side]));save();render();toast('คัดลอก Week ก่อนหน้าแล้ว')}});
eventsEl.addEventListener('click',e=>{const b=e.target.closest('[data-delevent]');if(!b)return;state.events.splice(+b.dataset.delevent,1);save();render()});
function shift(n){let d=new Date(state.year,state.month+n,1);load(d.getFullYear(),d.getMonth())} $('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);monthEl.onchange=()=>{if(!monthEl.value)return;const [y,m]=monthEl.value.split('-').map(Number);load(y,m-1)};
$('#copyPrev').onclick=()=>{let d=new Date(state.year,state.month-1,1), pkey=keyPrefix+`${d.getFullYear()}-${pad(d.getMonth()+1)}`,raw=localStorage.getItem(pkey);if(!raw)return toast('ยังไม่มีข้อมูลเดือนก่อน');const prev=JSON.parse(raw);state.weeks.forEach((w,i)=>{if(prev.weeks[i]){w.tuesday=JSON.parse(JSON.stringify(prev.weeks[i].tuesday));w.thursday=JSON.parse(JSON.stringify(prev.weeks[i].thursday))}});save();render();toast('คัดลอกข้อมูลเดือนก่อนแล้ว')};
$('#reset').onclick=()=>{if(!confirm('ล้างข้อมูลเดือนนี้ทั้งหมด?'))return;state=blankState(state.year,state.month);save();render()};
const modal=$('#modal');$('#addEvent').onclick=()=>{const first=state.weeks[0]?.thu||iso(new Date());$('#eventDate').value=first;$('#eventTitle').value='';modal.classList.add('open')};$('#cancelEvent').onclick=()=>modal.classList.remove('open');$('#saveEvent').onclick=()=>{const date=$('#eventDate').value,title=$('#eventTitle').value.trim(),color=$('#eventColor').value;if(!date||!title)return toast('กรอกวันที่และชื่อ Event');state.events.push({date,title,color});save();render();modal.classList.remove('open')};modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
function wrap(ctx,text,max){const words=String(text||'').split(/\s+/),lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>max&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines.slice(0,3)}
function drawCell(ctx,x,y,w,h,text,opt={}){ctx.fillStyle=opt.fill||'#fff';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);ctx.fillStyle=opt.color||'#111';ctx.font=`${opt.bold?'700':'500'} ${opt.size||22}px -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma`;ctx.textAlign=opt.align||'center';ctx.textBaseline='middle';const lines=wrap(ctx,text,w-16),lh=(opt.size||22)*1.15;lines.forEach((l,i)=>ctx.fillText(l,opt.align==='left'?x+8:x+w/2,y+h/2+(i-(lines.length-1)/2)*lh,w-14))}
async function exportPNG(){toast('กำลังสร้างภาพ...');const scale=1.35,W=1800,half=W/2,rowH=62,headH=54,titleH=78;let H=titleH+headH;state.events.forEach(()=>H+=72);state.weeks.forEach(w=>{const left=Math.max(w.tuesday.hm.length*rowH+w.tuesday.set.length*rowH+42*2,160),right=Math.max(w.thursday.hm.length*rowH+w.thursday.set.length*rowH+42*2,160);H+=54+Math.max(left,right)});H+=4;const c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);ctx.fillStyle='#111';ctx.font='italic 700 44px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(monthName(state.year,state.month),W/2,titleH/2);let y=titleH;drawCell(ctx,0,y,half,headH,'TUESDAY',{fill:'#f4bfd4',bold:true,size:25});drawCell(ctx,half,y,half,headH,'THURSDAY',{fill:'#f04a3f',bold:true,size:25});y+=headH;for(const e of state.events){drawCell(ctx,0,y,W,72,`${new Date(e.date).toLocaleDateString('en-GB',{day:'numeric',month:'long'})} ${e.title}`,{fill:e.color,bold:true,size:25});y+=72}for(let wi=0;wi<state.weeks.length;wi++){const w=state.weeks[wi];const heights=[];for(const side of ['tuesday','thursday']){const o=w[side];heights.push(Math.max(o.hm.length*rowH+o.set.length*rowH+84,160))}const bodyH=Math.max(...heights);for(let si=0;si<2;si++){const side=si===0?'tuesday':'thursday',o=w[side],x=si*half;drawCell(ctx,x,y,130,54,shortDate(new Date(side==='tuesday'?w.tue:w.thu)),{fill:si===0?'#fbe5ee':'#f6b2ab',bold:true,size:20});drawCell(ctx,x+130,y,half-130,54,`WEEK ${wi+1}`,{fill:'#fafafa',bold:true,size:18});let yy=y+54;drawCell(ctx,x,yy,half,42,'HM / PRODUCT',{fill:'#f3f3f3',bold:true,size:16});yy+=42;for(const r of o.hm){drawCell(ctx,x,yy,180,rowH,r.label,{bold:true,size:17,align:'left'});drawCell(ctx,x+180,yy,half-180,rowH,r.value,{color:'#2448f2',bold:true,size:18});yy+=rowH}drawCell(ctx,x,yy,half,42,'SET',{fill:'#f3f3f3',bold:true,size:16});yy+=42;for(const r of o.set){drawCell(ctx,x,yy,half*.58,rowH,r.label,{bold:true,size:16,align:'left'});drawCell(ctx,x+half*.58,yy,half*.42,rowH,r.value,{color:/ข้าว/.test(r.value)?'#ef3b31':'#2448f2',bold:true,size:17});yy+=rowH}if(yy<y+54+bodyH){ctx.fillStyle='#fff';ctx.fillRect(x,yy,half,y+54+bodyH-yy);ctx.strokeStyle='#111';ctx.strokeRect(x,yy,half,y+54+bodyH-yy)}}y+=54+bodyH}const blob=await new Promise(r=>c.toBlob(r,'image/png',1));const name=`HM-Schedule-${ym}.png`;const file=new File([blob],name,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$$('.export').forEach(b=>b.onclick=exportPNG);
const now=new Date();load(now.getFullYear(),now.getMonth());
})();
</script>
</body></html>
